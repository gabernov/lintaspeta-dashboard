<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MapLibre v6 tile test (ESM)</title>
  <style>
    body { margin: 0; background: #000; }
    #map { position: absolute; inset: 0; }
    #status { position: absolute; top: 10px; left: 10px; z-index: 10; background: #000; color: #0f0; padding: 8px 12px; font: 12px monospace; border-radius: 6px; white-space: pre-wrap; max-height: 90vh; overflow: auto; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">loading module…</div>
  <script type="module">
    import * as maplibregl from "/node_modules/maplibre-gl/dist/maplibre-gl.mjs";
    const status = document.getElementById('status');
    const log = (m) => { status.textContent += '\n' + m; console.log('[test]', m); };
    log('maplibre imported: ' + typeof maplibregl.Map);
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [107.6, -6.9],
      zoom: 9,
    });
    map.on('load', () => { log('LOAD FIRED zoom=' + map.getZoom() + ' center=' + JSON.stringify(map.getCenter())); });
    map.on('error', (e) => { log('MAP ERROR: ' + (e?.error?.message || JSON.stringify(e))); });
    map.on('sourcedata', (e) => { if (e.isSourceLoaded) log('source loaded: ' + e.sourceId); });
    map.on('idle', () => { log('IDLE: loaded=' + map.loaded() + ' zoom=' + map.getZoom()); });
    window.map = map;
    setTimeout(() => { log('T+10s: loaded=' + map.loaded() + ' styleLoaded=' + map.isStyleLoaded() + ' zoom=' + map.getZoom() + ' center=' + JSON.stringify(map.getCenter())); }, 10000);
  </script>
</body>
</html>
