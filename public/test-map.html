<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MapLibre v6 tile test</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.4.0/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@6.4.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; }
    #map { position: absolute; inset: 0; }
    #status { position: absolute; top: 10px; left: 10px; z-index: 10; background: #000; color: #0f0; padding: 8px 12px; font: 12px monospace; border-radius: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="status">init…</div>
  <script>
    const status = document.getElementById('status');
    const log = (m) => { status.textContent += '\n' + m; };
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
      center: [107.6, -6.9],
      zoom: 9,
    });
    map.on('load', () => { log('LOAD FIRED, zoom=' + map.getZoom()); });
    map.on('error', (e) => { log('ERROR: ' + (e && e.error && e.error.message ? e.error.message : JSON.stringify(e))); });
    map.on('sourcedata', (e) => { if (e.isSourceLoaded) log('source loaded: ' + e.sourceId); });
    window.map = map;
    setTimeout(() => { log('after 10s: loaded=' + map.loaded() + ' styleLoaded=' + map.isStyleLoaded() + ' zoom=' + map.getZoom() + ' center=' + JSON.stringify(map.getCenter())); }, 10000);
  </script>
</body>
</html>
