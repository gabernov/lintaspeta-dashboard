name: Keep Supabase Awake

on:
  schedule:
    # Every day at 06:00 UTC (13:00 WIB) - keeps free-tier project from pausing after 1 week idle
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase project
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health" \
            || echo "ping failed (non-fatal)"
