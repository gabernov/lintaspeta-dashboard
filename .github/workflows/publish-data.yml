name: Publish Data to Portal

on:
  repository_dispatch:
    types: [publish-data]
  workflow_dispatch:
    inputs:
      datasets:
        description: "Comma-separated datasets to publish (default: all)"
        required: false
        default: "ruas_jalan,sekolah,rambu,apj"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portal repo (lintaspeta-web)
        uses: actions/checkout@v4
        with:
          repository: gabernov/lintaspeta-web
          token: ${{ secrets.PORTAL_REPO_TOKEN }}
          path: portal

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pyarrow + requests
        run: pip install pyarrow requests

      - name: Determine datasets
        id: datasets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ds=${{ github.event.client_payload.datasets }}" >> "$GITHUB_OUTPUT"
          else
            echo "ds=${{ inputs.datasets }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build parquet from published tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATASETS: ${{ steps.datasets.outputs.ds }}
        run: |
          python scripts/build_parquet.py --portal portal --datasets "$DATASETS"

      - name: Commit + push parquet to portal repo
        working-directory: portal
        run: |
          git config user.name "lintaspeta-bot"
          git config user.email "bot@lintaspeta.local"
          git add maps
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): publish datasets [skip ci]"
            git push origin main
          fi

      - name: Deploy portal to Cloudflare Pages
        working-directory: portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@4 pages deploy . --project-name=lintaspeta-web --branch main
